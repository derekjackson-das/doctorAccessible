<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared files</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; background: #fff; line-height: 1.5; }
    button { font: inherit; padding: 0.5rem 1rem; border: 2px solid #005a9c; background: #fff; color: #005a9c; border-radius: 4px; }
    :focus-visible { outline: 3px solid #005a9c; outline-offset: 2px; }
    .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; padding: 1rem; }
    .dialog { background: #fff; padding: 1.5rem; border-radius: 6px; max-width: 28rem; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main id="page">
    <h1>Shared files</h1>
    <p>Budget-2026.xlsx, last changed 12 October.</p>
    <button type="button" id="delete-trigger">Delete Budget-2026.xlsx</button>
  </main>

  <div class="backdrop" id="backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-desc">
      <h2 id="dialog-title">Delete this file?</h2>
      <p id="dialog-desc">Budget-2026.xlsx will be removed for everyone it is shared with. This cannot be undone.</p>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="button" id="confirm">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const trigger = document.getElementById('delete-trigger');
    const backdrop = document.getElementById('backdrop');
    const page = document.getElementById('page');

    function openDialog() {
      backdrop.hidden = false;
      page.inert = true;
    }

    function closeDialog() {
      backdrop.hidden = true;
      page.inert = false;
      trigger.focus();
    }

    trigger.addEventListener('click', openDialog);
    document.getElementById('cancel').addEventListener('click', closeDialog);
    document.getElementById('confirm').addEventListener('click', closeDialog);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !backdrop.hidden) closeDialog();
    });
  </script>
</body>
</html>
