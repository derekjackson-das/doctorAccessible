<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library card application</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; background: #fff; line-height: 1.5; }
    label { display: block; font-weight: 600; }
    .hint { display: block; color: #4a4a4a; }
    input, button { font: inherit; padding: 0.5rem; margin-block: 0.25rem 1rem; }
    :focus-visible { outline: 3px solid #005a9c; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Apply for a library card</h1>
  </header>
  <main>
    <form action="/apply" method="post">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" autocomplete="name">

      <label for="dob">Date of birth</label>
      <span class="hint" id="dob-hint">Use the format DD/MM/YYYY</span>
      <input type="text" id="dob" name="dob" autocomplete="bday" aria-labelledby="dob-hint">

      <button type="submit">Apply</button>
    </form>
  </main>
</body>
</html>
