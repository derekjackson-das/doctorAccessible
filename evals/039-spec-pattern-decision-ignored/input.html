<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borrowing questions</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; background: #fff; line-height: 1.5; }
    button { font: inherit; padding: 0.5rem 1rem; border: 2px solid #005a9c; background: #fff; color: #005a9c; }
    a { color: #005a9c; }
    :focus-visible { outline: 3px solid #1a1a1a; outline-offset: 2px; }
    h2 { margin: 0.5rem 0 0; font-size: 1.125rem; }
    h2 button { inline-size: 100%; text-align: start; }
    .panel { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Borrowing questions</h1>
    <h2><button type="button" aria-expanded="false" aria-controls="q1">How many books can I borrow?</button></h2>
    <div class="panel" id="q1" hidden><p>Up to 20 books at a time, for four weeks each.</p></div>
    <h2><button type="button" aria-expanded="false" aria-controls="q2">Can I renew online?</button></h2>
    <div class="panel" id="q2" hidden><p>Yes. Sign in to your account and choose "Renew" next to each book.</p></div>
  </main>
  <script>
    document.querySelectorAll('h2 button').forEach((button) => {
      button.addEventListener('click', () => {
        const panel = document.getElementById(button.getAttribute('aria-controls'));
        const open = panel.hidden;
        panel.hidden = !open;
        button.setAttribute('aria-expanded', String(open));
      });
    });
  </script>
</body>
</html>
