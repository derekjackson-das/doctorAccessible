<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather alert</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #fff; }
    main { padding: 2rem; max-width: 40rem; }
    .alert {
      padding: 1.5rem 2rem;
      font-size: 1.25rem;
      font-weight: bold;
      color: #1a1a1a;
      background: #ffd400;
      animation: flash 0.2s steps(1) 20;
    }
    @keyframes flash {
      0%, 100% { background: #ffd400; }
      50% { background: #1a1a1a; color: #fff; }
    }
    :focus-visible { outline: 3px solid #005a9c; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Weather alert</h1>
  </header>
  <main>
    <p class="alert" role="alert">Campus is closed today because of the storm. All classes are cancelled.</p>
    <p>Check your email for updates from your department. Dining halls remain open.</p>
  </main>
</body>
</html>
