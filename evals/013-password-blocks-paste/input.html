<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; background: #fff; max-width: 24rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: bold; }
    input { font: inherit; padding: 0.5rem; width: 100%; box-sizing: border-box; }
    button { font: inherit; padding: 0.5rem 1.5rem; margin-top: 1.5rem; }
    :focus-visible { outline: 3px solid #005a9c; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Sign in</h1>
  </header>
  <main>
    <form action="/login" method="post">
      <label for="user">Username</label>
      <input type="text" id="user" name="user" autocomplete="username">
      <label for="pass">Password</label>
      <input type="password" id="pass" name="pass" autocomplete="off" onpaste="return false;" ondrop="return false;">
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
