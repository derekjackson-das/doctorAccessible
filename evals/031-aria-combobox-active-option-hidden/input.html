<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a department</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; background: #fff; line-height: 1.5; }
    label { display: block; font-weight: 600; }
    button { font: inherit; padding: 0.5rem 1rem; margin-block-start: 0.75rem; border: 2px solid #005a9c; background: #fff; color: #005a9c; }
    input { font: inherit; padding: 0.5rem; border: 2px solid #4a4a4a; width: min(24rem, 100%); }
    :focus-visible { outline: 3px solid #005a9c; outline-offset: 2px; }
    [role="listbox"] { list-style: none; margin: 0; padding: 0; border: 2px solid #4a4a4a; border-top: none; width: min(24rem, 100%); }
    [role="option"] { padding: 0.5rem; cursor: pointer; }
    [role="option"].active { background: #005a9c; color: #fff; font-weight: 700; outline: 2px solid #1a1a1a; outline-offset: -4px; }
  </style>
</head>
<body>
  <main>
    <h1>Find a department</h1>
    <form action="/departments" method="get">
      <label for="dept">Department</label>
      <input type="text" id="dept" name="dept" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="dept-list" autocomplete="off">
      <ul role="listbox" id="dept-list" aria-label="Departments" hidden></ul>
      <button type="submit">Find</button>
    </form>
  </main>

  <script>
    const departments = ['Anthropology', 'Astronomy', 'Biology', 'Chemistry', 'Classics', 'Computer Science', 'Economics', 'English', 'History', 'Linguistics', 'Mathematics', 'Music', 'Philosophy', 'Physics', 'Psychology', 'Sociology'];
    const input = document.getElementById('dept');
    const list = document.getElementById('dept-list');
    let active = -1;

    function render() {
      const typed = input.value.trim().toLowerCase();
      const matches = typed ? departments.filter((d) => d.toLowerCase().startsWith(typed)) : [];
      list.innerHTML = '';
      matches.forEach((name, i) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'option');
        li.id = 'dept-opt-' + i;
        li.textContent = name;
        li.addEventListener('mousedown', (event) => event.preventDefault());
        li.addEventListener('click', () => choose(name));
        list.appendChild(li);
      });
      active = -1;
      const open = matches.length > 0;
      list.hidden = !open;
      input.setAttribute('aria-expanded', String(open));
    }

    function highlight(index) {
      const options = list.querySelectorAll('[role="option"]');
      options.forEach((o, i) => o.classList.toggle('active', i === index));
      active = index;
    }

    function choose(name) {
      input.value = name;
      list.hidden = true;
      input.setAttribute('aria-expanded', 'false');
      active = -1;
    }

    input.addEventListener('input', render);
    input.addEventListener('keydown', (event) => {
      const options = list.querySelectorAll('[role="option"]');
      if (list.hidden || options.length === 0) return;
      if (event.key === 'ArrowDown') { event.preventDefault(); highlight((active + 1) % options.length); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); highlight(active <= 0 ? options.length - 1 : active - 1); }
      else if (event.key === 'Enter' && active >= 0) { event.preventDefault(); choose(options[active].textContent); }
      else if (event.key === 'Escape') { list.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; }
    });
    input.addEventListener('blur', () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); });
  </script>
</body>
</html>
